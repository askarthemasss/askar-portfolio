<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C4956A" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#C4956A" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    :root {
      --bg: #F8F4F0;
      --stroke: #1A1A1A;
      --accent: #C4956A;
      --ring: rgba(26, 26, 26, 0.18);
      --inner: rgba(196, 149, 106, 0.25);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141210;
        --stroke: #EDE8E1;
        --accent: #D4A373;
        --ring: rgba(237, 232, 225, 0.22);
        --inner: rgba(212, 163, 115, 0.3);
      }
    }
    .bg { fill: var(--bg); }
    .stroke { stroke: var(--stroke); }
    .accent-stroke { stroke: var(--accent); }
    .accent-fill { fill: var(--accent); }
    .ring { stroke: var(--ring); }
    .inner-guide { stroke: var(--inner); }
  </style>

  <!-- Warm artisanal paper background tile with soft rounded corners -->
  <rect width="64" height="64" rx="15" class="bg" />

  <!-- Outer celestial compass rings -->
  <circle cx="32" cy="32" r="27.5" fill="none" class="ring" stroke-width="0.8" />
  <circle cx="32" cy="32" r="24.5" fill="none" class="ring" stroke-width="0.7" stroke-dasharray="2.5, 3" />
  <circle cx="32" cy="32" r="15" fill="none" class="inner-guide" stroke-width="0.6" stroke-dasharray="1.5, 2" />

  <!-- Subtle glow at center -->
  <circle cx="32" cy="32" r="16" fill="url(#starGlow)" />

  <!-- The Architectural Craftsman "A" / Chevron (Askar & Angular) -->
  <!-- Left strut -->
  <line x1="32" y1="13" x2="16.5" y2="49" class="stroke" stroke-width="2.4" stroke-linecap="round" />
  <!-- Right strut -->
  <line x1="32" y1="13" x2="47.5" y2="49" class="stroke" stroke-width="2.4" stroke-linecap="round" />
  <!-- Inner precision crossbar -->
  <line x1="21.5" y1="37" x2="42.5" y2="37" class="stroke" stroke-width="1.2" stroke-dasharray="2, 2" stroke-linecap="round" />

  <!-- Celestial 8-point compass star / waypoint beacon -->
  <g transform="translate(32, 32)">
    <!-- Cardinal rays -->
    <line x1="-10" y1="0" x2="10" y2="0" class="accent-stroke" stroke-width="2.2" stroke-linecap="round" />
    <line x1="0" y1="-10" x2="0" y2="10" class="accent-stroke" stroke-width="2.2" stroke-linecap="round" />
    <!-- Diagonal rays -->
    <line x1="-6" y1="-6" x2="6" y2="6" class="accent-stroke" stroke-width="1.3" stroke-linecap="round" />
    <line x1="6" y1="-6" x2="-6" y2="6" class="accent-stroke" stroke-width="1.3" stroke-linecap="round" />
    <!-- Center copper beacon point -->
    <circle cx="0" cy="0" r="2.2" class="accent-fill" />
    <circle cx="0" cy="0" r="4" fill="none" class="accent-stroke" stroke-width="0.6" stroke-dasharray="1, 1.5" />
  </g>

  <!-- Four cardinal tick marks on the outer rim -->
  <line x1="32" y1="4.5" x2="32" y2="7.5" class="accent-stroke" stroke-width="1.2" stroke-linecap="round" />
  <line x1="32" y1="56.5" x2="32" y2="59.5" class="accent-stroke" stroke-width="1.2" stroke-linecap="round" />
  <line x1="4.5" y1="32" x2="7.5" y2="32" class="accent-stroke" stroke-width="1.2" stroke-linecap="round" />
  <line x1="56.5" y1="32" x2="59.5" y2="32" class="accent-stroke" stroke-width="1.2" stroke-linecap="round" />
</svg>
